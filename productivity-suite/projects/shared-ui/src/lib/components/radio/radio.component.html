<ui-field [label]="label()" [forId]="id()" [required]="required()" [hasError]="hasError" [hint]="hint()" variant="selection">
  <div class="df fd-c gap-1">
    @for (option of options(); track option.value) {
      <label class="df fd-r ai-c gap-1" style="cursor: pointer;">
        <input
          type="radio"
          [name]="id()"
          [disabled]="isDisabled() || disabled()"
          [value]="option.value"
          [checked]="internalValue() === option.value"
          (change)="onChangeEvent(option.value)"
          (blur)="markAsTouched()"
        />
        <span>{{ option.label }}</span>
      </label>
    }
  </div>
</ui-field>
