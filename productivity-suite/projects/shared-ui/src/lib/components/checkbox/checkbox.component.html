<ui-field [hasError]="hasError" [hint]="hint()" variant="selection">
  <label class="df fd-r ai-c gap-2" style="cursor: pointer;">
    <input
      type="checkbox"
      [id]="id()"
      [disabled]="isDisabled() || disabled()"
      [checked]="!!internalValue()"
      (change)="onChangeEvent($event)"
      (blur)="markAsTouched()"
    />
    <span>
      {{ label() }}
      @if (required()) { <span class="ui-field-required">*</span> }
    </span>
  </label>
</ui-field>
