<div class="duration-picker-container" [class.disabled]="isDisabled()">
    <div class="df fd-r ai-c gap-2">
        <mat-form-field appearance="outline" class="time-field hide-subscript">
            <mat-label>Hours</mat-label>
            <input matInput type="number" [(ngModel)]="hours" (ngModelChange)="onTimeChange()" min="0" max="23"
                placeholder="00" [disabled]="isDisabled()" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="time-field hide-subscript">
            <mat-label>Minutes</mat-label>
            <input matInput type="number" [(ngModel)]="minutes" (ngModelChange)="onTimeChange()" min="0" max="59"
                placeholder="00" [disabled]="isDisabled()" />
        </mat-form-field>
    </div>
</div>
