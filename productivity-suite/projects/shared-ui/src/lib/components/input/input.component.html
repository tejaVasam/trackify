<ui-field [label]="label()" [forId]="id()" [required]="required()" [hasError]="hasError" [hint]="hint()">
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled() || disabled()"
    [value]="internalValue() || ''"
    (input)="onInput($event)"
    (blur)="markAsTouched()"
    class="form-input-reset"
  />
</ui-field>
