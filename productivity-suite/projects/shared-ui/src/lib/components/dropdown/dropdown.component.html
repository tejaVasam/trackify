<ui-field [label]="label()" [forId]="id()" [required]="required()" [hasError]="hasError" [hint]="hint()">
  <select
    [id]="id()"
    [disabled]="isDisabled() || disabled()"
    (change)="onChangeEvent($event)"
    (blur)="markAsTouched()"
    class="form-input-reset is-select"
  >
    <option [value]="null" [disabled]="true" [selected]="internalValue() == null">
      {{ placeholder() || 'Select an option' }}
    </option>
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="internalValue() === option.value">
        {{ option.label }}
      </option>
    }
  </select>
</ui-field>
