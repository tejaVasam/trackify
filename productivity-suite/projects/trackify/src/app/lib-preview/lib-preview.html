<div class="p-16 df fd-c gap-8" style="max-width: 600px; margin: 0 auto;">
  <h1>Shared UI Components Preview</h1>

  <form [formGroup]="previewForm" class="df fd-c gap-4">

    <!-- Input Component -->
    <div class="p-16" style="border: 1px solid var(--border-color, #eaeaea); border-radius: 8px;">
      <h3 style="margin-top:0">1. Input Component</h3>
      <ui-input
        formControlName="textInput"
        label="Sample Text Input"
        placeholder="Type something..."
        hint="Example of a hint text below the input"
        [required]="true"
      ></ui-input>
    </div>

    <!-- Dropdown Component -->
    <div class="p-16" style="border: 1px solid var(--border-color, #eaeaea); border-radius: 8px;">
      <h3 style="margin-top:0">2. Dropdown Component</h3>
      <ui-dropdown
        formControlName="dropdownSelection"
        label="Sample Dropdown"
        placeholder="Please pick an option"
        [options]="dropdownOptions"
        [required]="true"
      ></ui-dropdown>
    </div>

    <!-- Checkbox Component -->
    <div class="p-16" style="border: 1px solid var(--border-color, #eaeaea); border-radius: 8px;">
      <h3 style="margin-top:0">3. Checkbox Component</h3>
      <ui-checkbox
        formControlName="checkValue"
        label="I accept the terms and conditions"
        [required]="true"
      ></ui-checkbox>
    </div>

    <!-- Radio Component -->
    <div class="p-16" style="border: 1px solid var(--border-color, #eaeaea); border-radius: 8px;">
      <h3 style="margin-top:0">4. Radio Component</h3>
      <ui-radio
        formControlName="radioSelection"
        label="Select a Choice"
        [options]="radioOptions"
        [required]="true"
      ></ui-radio>
    </div>

    <!-- Date Component -->
    <div class="p-16" style="border: 1px solid var(--border-color, #eaeaea); border-radius: 8px;">
      <h3 style="margin-top:0">5. Date Component</h3>
      <ui-date
        formControlName="dateValue"
        label="Pick a Date"
        hint="Select your preferred deadline"
        [required]="false"
      ></ui-date>
    </div>

    <!-- Button Component -->
    <div class="p-16" style="border: 1px solid var(--border-color, #eaeaea); border-radius: 8px;">
      <h3 style="margin-top:0">6. Button Components</h3>
      <div class="df fd-r gap-4">
        <ui-button variant="primary" (clicked)="onButtonClick()">Primary Action</ui-button>
        <ui-button variant="secondary" (clicked)="onButtonClick()">Secondary</ui-button>
      </div>
    </div>

  </form>
</div>
