<mat-drawer-container [hasBackdrop]="true" class="w-100">
  <mat-drawer #drawer mode="over" position="end" [opened]="drawerOpened()" (closedStart)="onDrawerClose(false)"
    class="h-100" style="width: 80%;">
    @if (drawerOpened()) {
    <t-create-habit [habit]="selectedHabit()" (close)="onDrawerClose($event)" />
    }
  </mat-drawer>

  <mat-drawer-content>
    <div class="p-16 df fd-c gap-8">
      <div class="df fd-r ai-c jc-s">
        <h2 class="m-0 fs-24 fw-700">My Habits</h2>
        <div class="df fd-r ai-c gap-4">
          <button mat-flat-button color="primary" (click)="openCreateHabitDialog()" class="br-8 text-bg">
            New Habit
          </button>
        </div>
      </div>

      <div class="df fd-c gap-4">
        <mat-form-field appearance="outline" style="width: 160px;">
          <mat-select [value]="selectedCategoryId()" (selectionChange)="selectedCategoryId.set($event.value)">
            <mat-option value="all">All Categories</mat-option>
            @for(cat of categories(); track cat.id) {
            <mat-option [value]="cat.id">{{ cat.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <div class="df fd-c gap-4" cdkDropList (cdkDropListDropped)="drop($event)">
        @for(habit of filteredHabits(); track habit.id) {
        <t-habit-card cdkDrag [habit]="habit" [allDays]="allDays" (edit)="editHabit(habit)" (delete)="deleteHabit(habit)"
          (view)="viewDetails(habit.id!)" />
        } @empty {
        <div class="empty-state p-32 df fd-c ai-c gap-4 b-1-dashed br-8">
          <p class="m-0 text-secondary">No habits found. Let's create one!</p>
          <button mat-stroked-button color="primary" (click)="openCreateHabitDialog()">Quick Create</button>
        </div>
        }
      </div>
    </div>
  </div>
</mat-drawer-content>
</mat-drawer-container>
