<div class="calendar-container df fd-c gap-4 p-16 bg-white br-24 select-none  h-50%">
    <!-- Calendar Header -->
    <div class="df fd-r jc-sb ai-c mb-16 jc-s">
        <h3 class="m-0 fs-18 fw-800 text-primary">{{ monthDisplay() }}</h3>
        <div class="df fd-r gap-2 bg-surface p-4 br-12 ai-c">
            <button mat-icon-button (click)="shiftMonth(-1)">
                <mat-icon>chevron_left</mat-icon>
            </button>
            <button mat-stroked-button (click)="goToToday()" class="today-btn">Today</button>
            <button mat-icon-button (click)="shiftMonth(1)">
                <mat-icon>chevron_right</mat-icon>
            </button>
        </div>
    </div>

    <!-- Weekday Headers -->
    <div class="df fd-r w-100 mb-8">
        @for (day of ['S', 'M', 'T', 'W', 'T', 'F', 'S']; track $index) {
        <div class="text-center fs-11 fw-700 text-secondary uppercase ls-1" style="flex: 1;">
            {{ day }}
        </div>
        }
    </div>

    <!-- Days Grid -->
    <div class="df fd-r flex-wrap w-100">
        @for (day of days(); track day.dateStr) {
        <div class="df ai-c jc-c" style="flex: 0 0 14.28%; height: 44px;">
            <button class="day-cell br-12 border-none df ai-c jc-c fw-700 fs-14 transition-all"
                [class.today]="day.isToday" [class.different-month]="!day.isCurrentMonth"
                [class.selected]="day.dateStr === selectedDate()" (click)="onDateClick(day.dateStr)">
                {{ day.dayNum }}
            </button>
        </div>
        }
    </div>
</div>
