<div class="df fd-c gap-4 p-20 br-24 bg-white"
    style="box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); box-sizing: border-box;">
    <div class="df fd-r jc-s ai-c ">
        <div class="df fd-c">
            <span class="fs-11 fw-700 text-secondary uppercase ls-1">Daily Capacity</span>
            <h2 class="m-0 fs-18 fw-800 text-primary">{{ formatTime(dedicatedMinutes()) }} total habits</h2>
        </div>
        <div class="df fd-c ai-fe">
            <span class="fs-20 fw-900" style="color: #10b981; line-height: 1;">{{ percentage() }}%</span>
            <span class="fs-10 fw-700 text-secondary uppercase">Done</span>
        </div>
    </div>

    <!-- Linear Stacked Progress Bar -->
    <div style="height: 12px; width: 100%; position: relative;">
        <canvas baseChart [data]="chartData()" [options]="chartOptions" type="bar">
        </canvas>
    </div>

    <div class="df fd-r jc-sb ai-c mt-4 flex-wrap gap-2">
        <div class="df ai-c gap-3">
            <div class="df ai-c gap-1">
                <div class="br-pill" style="width: 8px; height: 8px; background-color: #10b981;"></div>
                <span class="fs-11 fw-700 text-secondary">{{ formatTime(completedMinutes()) }} Done</span>
            </div>
            <div class="df ai-c gap-1">
                <div class="br-pill" style="width: 8px; height: 8px; background-color: #6366f1;"></div>
                <span class="fs-11 fw-700 text-secondary">{{ formatTime(dedicatedMinutes() - completedMinutes()) }}
                    Left</span>
            </div>
            <div class="df ai-c gap-1">
                <div class="br-pill" style="width: 8px; height: 8px; background-color: #f1f5f9;"></div>
                <span class="fs-11 fw-700 text-secondary">{{ formatTime(1440 - dedicatedMinutes()) }} Free</span>
            </div>
        </div>
    </div>
</div>
