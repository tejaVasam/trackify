<mat-sidenav-container style="height: 100vh;">
  <!-- Sidenav specific sidebar definition -->
  <mat-sidenav [opened]="isSidenavOpened()" [mode]="isMobile() ? 'over' : 'side'" [autoFocus]="false"
    style="width: 260px; box-shadow: 2px 0 6px rgb(0 0 0 / 10%);">
    <div class="df fd-c h-100" style="height: 100%;">
      <div class="p-16 df ai-c gap-8" style="height: 64px; box-sizing: border-box;">
        <mat-icon color="primary" class="fs-24">track_changes</mat-icon>
        <span class="fs-20" style="font-weight: 500;">Trackify</span>
      </div>

      <mat-nav-list style="flex: 1;">
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/today" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>today</mat-icon>
          <span matListItemTitle>Today</span>
        </a>
        <a mat-list-item routerLink="/habits" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>list</mat-icon>
          <span matListItemTitle>Habits</span>
        </a>
        <a mat-list-item routerLink="/categories" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>Categories</span>
        </a>
      </mat-nav-list>

      <mat-nav-list>
        <a mat-list-item routerLink="/settings" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Settings</span>
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>

  <!-- Interactive primary focus UI container -->
  <mat-sidenav-content style="background-color: var(--background-alt);">
    <!-- Projected Header Slot -->
    <ng-content select="t-header"></ng-content>

    <div class="app-router-wrapper" [style.height]="isMobile() ? 'calc(100vh - 64px - 80px)' : 'calc(100vh - 64px)'"
      style="overflow-y: auto;">
      <div style="max-width: 1200px; margin: 0 auto; padding-bottom: 16px;">
        <ng-content></ng-content>
      </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    @if(isMobile()) {
    <div class="mobile-bottom-nav">
      <div class="nav-item" routerLink="/dashboard" routerLinkActive="active-tab">
        <mat-icon>home</mat-icon>
      </div>
      <div class="nav-item" routerLink="/today" routerLinkActive="active-tab">
        <mat-icon>favorite</mat-icon>
      </div>

      <div class="nav-center-item" routerLink="/habits">
        <div class="fab-btn">
          <mat-icon>add</mat-icon>
        </div>
      </div>

      <div class="nav-item" routerLink="/categories" routerLinkActive="active-tab">
        <mat-icon>category</mat-icon>
      </div>
      <div class="nav-item" routerLink="/settings" routerLinkActive="active-tab">
        <mat-icon>person</mat-icon>
      </div>
    </div>
    }
  </mat-sidenav-content>
</mat-sidenav-container>
