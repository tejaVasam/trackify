<mat-sidenav-container class="app-elm-1">
  <!-- Sidenav specific sidebar definition -->
  <mat-sidenav [opened]="isSidenavOpened()" [mode]="isMobile() ? 'over' : 'side'" [autoFocus]="false" class="app-elm-2">
    <div class="df fd-c h-100 app-elm-3" >
      <div class="p-16 df ai-c gap-8 app-elm-4" >
        <mat-icon color="primary" class="fs-24">track_changes</mat-icon>
        <span class="fs-20 app-elm-5" >Trackify</span>
      </div>
      
      <mat-nav-list class="app-elm-6">
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/habits" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>checklist</mat-icon>
          <span matListItemTitle>Habits</span>
        </a>
        <a mat-list-item routerLink="/today" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>today</mat-icon>
          <span matListItemTitle>Today</span>
        </a>
        <a mat-list-item routerLink="/categories" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>Categories</span>
        </a>
      </mat-nav-list>

      <mat-nav-list>
        <a mat-list-item routerLink="/settings" routerLinkActive="active" (click)="closeOnMobile()">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Settings</span>
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>

  <!-- Interactive primary focus UI container -->
  <mat-sidenav-content class="app-elm-7">
    <mat-toolbar color="primary" class="app-elm-8">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle sidenav">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="fs-20 app-elm-9" >{{ title() }}</span>
      <span class="flex-1"></span>
      
      @if (activeUser()?.avatar) {
        <div class="df fd-r ai-c gap-8 px-8">
            <button mat-icon-button (click)="themeService.toggleTheme()" aria-label="Toggle theme">
               <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
            </button>
            <span class="fs-14 fw-600 hide-on-mobile">{{ activeUser()?.name }}</span>
            <div class="app-elm-10">
                <img [src]="activeUser()?.avatar" class="app-elm-11" alt="avatar">
            </div>
        </div>
      }
    </mat-toolbar>
    
    <div class="app-router-wrapper app-elm-12" >
      <div class="app-elm-13">
        <router-outlet></router-outlet>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
